{% extends "base_light.html" %}{% block nav_weekly %}{% endblock %}

{% block content %}
<div class="wrap">
  <div class="title">
    <span class="material-symbols-outlined">calendar_month</span> 周选点餐
    <span class="sub" id="hint">选择老人后开始点餐</span>
    <span id="hintToggle" style="display:none;cursor:pointer;color:var(--blue);font-size:13px;margin-left:8px" onclick="document.getElementById('hintToggle').style.display='none';document.getElementById('searchArea').style.display='block';document.getElementById('hint').style.display='inline'">← 更换老人</span></div>

  <div id="searchArea">
  <input class="inp" type="text" id="q" placeholder="搜索老人姓名..." autocomplete="off" autofocus>
  <div id="list" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
    <div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">search</span></div><p>输入姓名搜索老人</p></div>
  </div>
  </div>

  <div id="act" style="display:none;margin-top:20px">
    <!-- Week & resident context -->
    <div class="c" style="padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px">
        <span class="material-symbols-outlined" style="color:var(--blue)">today</span>
        <span>选餐周:</span>
        <input type="date" class="inp" id="weekStart" style="width:auto;padding:6px 10px;font-size:13px">
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
        <span class="material-symbols-outlined" style="font-size:16px;color:var(--ink3)">checklist</span>
        <span style="font-size:13px;color:var(--ink3)" id="status">—</span>
      </div>
    </div>

    <!-- Day tabs + menu area -->
    <div id="week"></div>

    <!-- Submit bar -->
    <div class="c" id="submitBar" style="display:none;padding:16px 20px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;font-size:14px;font-weight:600" id="submitSummary">尚未选择任何菜品</div>
      <button class="submit" id="go" disabled onclick="submitAll()" style="width:auto;padding:12px 28px;font-size:14px">
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px">description</span>提交整周点餐
      </button>
    </div>
  </div>
</div>

<script>
var sr=null, choices={}, allResidents=[], currentPage=1, pageSize=9;
function init(){var d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7));document.getElementById('weekStart').value=d.toISOString().slice(0,10);loadAllResidents()}
init();document.getElementById('weekStart').addEventListener('change',function(){
  var d=new Date(this.value);d.setDate(d.getDate()+((5-d.getDay()+7)%7));this.value=d.toISOString().slice(0,10);
  if(sr)loadMenu();
});

function loadAllResidents(){
  fetch('/api/residents/?limit=200').then(function(r){return r.json()}).then(function(d){
    allResidents = d.items || d; currentPage = 1; renderResidents(allResidents);
  });
}

var t;document.getElementById('q').addEventListener('input',function(){
  clearTimeout(t);var q=this.value.trim().toLowerCase();
  t=setTimeout(function(){currentPage=1;
    if(!q){renderResidents(allResidents);return}
    var filtered=allResidents.filter(function(r){return r.name.indexOf(q)>=0||r.building.indexOf(q)>=0||(r.diagnosis||'').indexOf(q)>=0});
    renderResidents(filtered);
  },150);
});

function renderResidents(all){
  var total=all.length, pages=Math.ceil(total/pageSize);
  var start=(currentPage-1)*pageSize, items=all.slice(start,start+pageSize);
  var l=document.getElementById('list');
  if(!items.length){l.innerHTML='<div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">sentiment_dissatisfied</span></div><p>未找到匹配的老人</p></div>';return}
  var html='';
  items.forEach(function(r){html+='<div class="rc" data-id="'+r.id+'" onclick="sel('+r.id+',\''+r.name+'\',\''+r.room+'\')">'+
    '<div class="av">'+r.name.charAt(0)+'</div><div class="inf"><div class="n">'+r.name+' · '+r.room+'室</div>'+
    '<div class="m">'+r.care_level+' | '+r.building+r.floor+'</div></div><div class="ck"></div></div>'});
  if(pages>1){
    html+='<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font-size:14px">';
    html+='<button class="btn" style="padding:6px 12px;font-size:13px" onclick="currentPage=Math.max(1,currentPage-1);renderResidents(all);return false"'+(currentPage<=1?' disabled':'')+'>上一页</button>';
    html+='<span style="color:var(--ink3)">第 '+currentPage+'/'+pages+' 页（共 '+total+' 人）</span>';
    html+='<button class="btn" style="padding:6px 12px;font-size:13px" onclick="currentPage=Math.min(pages,currentPage+1);renderResidents(all);return false"'+(currentPage>=pages?' disabled':'')+'>下一页</button>';
    html+='</div>';
  }
  l.innerHTML=html;
}

function sel(id,name,room){sr={id:id,name:name,room:room};
  document.querySelectorAll('.rc').forEach(function(c){c.classList.remove('sel')});document.querySelector('[data-id="'+id+'"]').classList.add('sel');
  document.getElementById('hint').textContent='已选：'+name+' · '+room+'室';
  document.getElementById('hintToggle').style.display='inline';
  document.getElementById('searchArea').style.display='none';
  document.getElementById('act').style.display='block';loadMenu();
}

function loadMenu(){
  var friday=document.getElementById('weekStart').value;
  var d=new Date(friday);d.setDate(d.getDate()+3);var ws=d.toISOString().slice(0,10);
  document.getElementById('week').innerHTML='<div class="empty"><p>加载菜单中…</p></div>';
  fetch('/api/week-menu/?week_start='+ws).then(function(r){return r.json()}).then(function(data){
    if(!data.length){document.getElementById('week').innerHTML='<div class="empty"><div class="ic"><span class="material-symbols-outlined">inbox</span></div><p>该周暂无菜单，请先在管理后台录入</p></div>';return}
    window._weekData = data; window._currentDay = '周一';
    renderDay('周一');
    document.getElementById('status').textContent=data.length+' 餐已配置';
    updateSummary();
  });
}

function renderDay(day){
  var data = window._weekData; window._currentDay = day;
  var days=['周一','周二','周三','周四','周五','周六','周日'], meals=['早餐','午餐','晚餐'];
  var dayItems=data.filter(function(m){return m.day===day});
  var mealIcons = {'早餐':'wb_sunny','午餐':'wb_sunny','晚餐':'bedtime'};

  // Day tabs — show indicator if dishes selected
  var html='<div style="display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap">';
  days.forEach(function(d){
    var active = d===day;
    var hasSelection = false;
    meals.forEach(function(mt){var k=d+'|'+mt;if(choices[k]&&choices[k].length>0)hasSelection=true;});
    html+='<button class="btn'+(active?' sel':'')+'" style="padding:10px 16px;font-size:14px;min-width:52px;position:relative" onclick="renderDay(\''+d+'\')">'+d+
      (hasSelection?'<span style="position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--blue)"></span>':'')+
      '</button>';
  });
  html+='</div>';

  if(!dayItems.length){
    html+='<div class="empty" style="padding:28px"><p>'+day+'暂无菜单配置</p></div>';
  } else {
    dayItems.forEach(function(m){
      var selectedCount = choices[day+'|'+m.meal_type] ? choices[day+'|'+m.meal_type].length : 0;
      html+='<div class="c" style="margin-bottom:14px">';
      html+='<div class="c-h"><span class="material-symbols-outlined">'+(mealIcons[m.meal_type]||'restaurant')+'</span> '+m.meal_type;
      html+='<span style="margin-left:auto;font-size:12px;font-weight:400;color:var(--ink3)">'+
        m.dishes.length+' 道可选'+(selectedCount>0?' · <span style="color:var(--blue);font-weight:600">已选 '+selectedCount+' 道</span>':'')+'</span></div>';
      html+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
      m.dishes.forEach(function(dish){
        var key=day+'_'+m.meal_type+'_'+dish.id;
        var isChecked = choices[day+'|'+m.meal_type] && choices[day+'|'+m.meal_type].indexOf(dish.id) >= 0;
        html+='<label style="display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border:2px solid '+(isChecked?'var(--blue)':'var(--line)')+';background:'+(isChecked?'var(--blue2)':'transparent')+';border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:all .12s;user-select:none" id="lbl_'+key+'">'+
          '<input type="checkbox" value="'+dish.id+'" onchange="tog(\''+dish.id+'\',\''+day+'\',\''+m.meal_type+'\')" style="accent-color:var(--blue);width:16px;height:16px"'+(isChecked?' checked':'')+'> '+dish.name+
          '</label>';
      });
      html+='</div></div>';
    });
  }

  // Bottom nav
  var idx = days.indexOf(day);
  html+='<div style="display:flex;justify-content:space-between;margin-top:20px">';
  html+='<button class="btn" style="padding:10px 16px;font-size:14px"'+(idx<=0?' disabled':'')+' onclick="renderDay(\''+days[idx-1]+'\')"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">chevron_left</span> '+ (idx>0?days[idx-1]:'') +'</button>';
  html+='<button class="btn" style="padding:10px 16px;font-size:14px"'+(idx>=6?' disabled':'')+' onclick="renderDay(\''+days[idx+1]+'\')">'+ (idx<6?days[idx+1]:'') +' <span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">chevron_right</span></button>';
  html+='</div>';

  document.getElementById('week').innerHTML=html;
  document.getElementById('go').disabled=false;
  updateSummary();
}

function tog(dishId,day,mt){
  var k=day+'|'+mt;
  if(!choices[k])choices[k]=[];
  var dishIdNum = parseInt(dishId);
  var idx = choices[k].indexOf(dishIdNum);
  if(idx < 0){choices[k].push(dishIdNum)}else{choices[k].splice(idx,1)}
  renderDay(window._currentDay);
}

function updateSummary(){
  var totalMeals=0, totalDishes=0;
  var days=['周一','周二','周三','周四','周五','周六','周日'],meals=['早餐','午餐','晚餐'];
  days.forEach(function(d){meals.forEach(function(mt){
    var k=d+'|'+mt; if(choices[k]&&choices[k].length>0){totalMeals++; totalDishes+=choices[k].length;}
  });});
  var el = document.getElementById('submitSummary');
  if(totalMeals===0){el.textContent='尚未选择任何菜品'}else{
    el.innerHTML='已选 <span style="color:var(--blue)">'+totalMeals+'</span> 餐 · <span style="color:var(--blue)">'+totalDishes+'</span> 道菜';
  }
}

function submitAll(){
  if(!sr){return}var b=document.getElementById('go'),ws=document.getElementById('weekStart').value;
  var days=['周一','周二','周三','周四','周五','周六','周日'],meals=['早餐','午餐','晚餐'],payload=[];
  var d=new Date(ws);d.setDate(d.getDate()+3);
  days.forEach(function(day,i){
    meals.forEach(function(mt){
      var k=day+'|'+mt,dishIds=choices[k]||[];
      if(dishIds.length>0){
        var date=new Date(d);date.setDate(date.getDate()+i);
        payload.push({resident_id:sr.id,date:date.toISOString().slice(0,10),meal_type:mt,dish_ids:dishIds,special_requests:'',ordered_by:''});
      }
    });
  });
  if(!payload.length){toast('请至少选择一餐','#e05555');return}
  b.disabled=true;b.textContent='提交中…';
  fetch('/api/meal-orders/batch/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(d){if(d.status==='created'){toast('<span class="material-symbols-outlined">check_circle</span> 已为 '+sr.name+' 提交整周点餐 · '+d.count+' 餐，即将跳转…','#3ca07a');setTimeout(function(){window.location.href='/admin/meals/mealorder/';},1500)}else{toast('提交失败','#e05555')}})
    .catch(function(){toast('网络错误','#e05555')}).finally(function(){b.disabled=false;b.textContent='<span class="material-symbols-outlined">description</span> 提交整周点餐'});
}
</script>
{% endblock %}
