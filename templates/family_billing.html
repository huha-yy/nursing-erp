{% extends "family_base.html" %}{% block nav_bill %}on{% endblock %}{% load i18n %}

{% block content %}
<div class="wrap">
  <div class="title">
    <span class="material-symbols-outlined">receipt_long</span> {% translate "账单" %}
    <span class="sub">{% translate "默认显示截至所选月份的全部账单" %}</span>
  </div>

  <div class="c" style="padding:16px 20px;display:flex;align-items:center;gap:10px">
    <span class="material-symbols-outlined" style="color:var(--blue)">today</span>
    <span style="font-weight:600;font-size:14px">{% translate "截至月份:" %}</span>
    <input type="month" class="inp" id="month" style="width:auto;padding:6px 10px;font-size:13px">
  </div>

  <div id="blocks"><div class="empty"><p">{% translate "加载中…" %}</p></div></div>
</div>

<script>
var TZ = {
  noBinding: '{% translate "暂未绑定老人" %}',
  loadFail: '{% translate "加载失败，请刷新重试" %}',
  periodCnt: '{% translate "期" %}',
  arrearsInfo: '{% translate "有 {} 期账单待缴费，合计 {}（最早未缴月份：{}），请尽快与院方联系缴费" %}',
  thMonth: '{% translate "月份" %}',
  thBed: '{% translate "床位费" %}',
  thNursing: '{% translate "护理费" %}',
  thMeal: '{% translate "餐费" %}',
  thTotal: '{% translate "合计" %}',
  thStatus: '{% translate "状态" %}',
  thSettle: '{% translate "缴费信息" %}',
  noBill: '{% translate "暂无账单" %}'
};
function trfmt(tpl) {
  var vals = Array.prototype.slice.call(arguments, 1), i = 0;
  return tpl.replace(/\{\}/g, function () { return vals[i++]; });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return n==null?'—':'¥'+Number(n).toFixed(2)}

var mEl=document.getElementById('month');
mEl.value=new Date().toISOString().slice(0,7);
mEl.addEventListener('change',load);
load();

function load(){
  fetch('/api/family/billing/?month='+mEl.value)
    .then(function(r){return r.json()})
    .then(function(d){
      var rows=d.residents||[];
      if(!rows.length){document.getElementById('blocks').innerHTML='<div class="empty"><p>'+TZ.noBinding+'</p></div>';return}
      document.getElementById('blocks').innerHTML=rows.map(block).join('');
    })
    .catch(function(){document.getElementById('blocks').innerHTML='<div class="empty"><p>'+TZ.loadFail+'</p></div>'});
}

function block(row){
  var a=row.arrears;
  var html='<div class="c"><div class="c-h"><span class="material-symbols-outlined">person</span> '+esc(row.resident.name)+
    '<span class="b b-dim" style="margin-left:8px">'+esc(row.resident.relation)+'</span>'+
    '<span class="cnt">'+row.bills.length+'<span> '+TZ.periodCnt+'</span></span></div>';
  if(a){
    html+='<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#991b1b">'+
      '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;margin-right:4px">error</span>'+
      trfmt(TZ.arrearsInfo,'<b>'+a.unpaid_months+'</b>','<b>'+money(a.outstanding)+'</b>',esc(a.oldest_month))+'</div>';
  }
  html+=row.bills.length?('<table><thead><tr><th>'+TZ.thMonth+'</th><th>'+TZ.thBed+'</th><th>'+TZ.thNursing+'</th><th>'+TZ.thMeal+'</th><th>'+TZ.thTotal+'</th><th>'+TZ.thStatus+'</th><th>'+TZ.thSettle+'</th></tr></thead><tbody>'+
    row.bills.map(function(b){
      var settled=b.settled_at?(esc((b.settled_at||'').slice(0,10))+(b.settled_by?(' · '+esc(b.settled_by)):'')):'—';
      return '<tr><td>'+esc(b.month)+'</td><td>'+money(b.bed_fee)+'</td><td>'+money(b.nursing_fee)+'</td><td>'+money(b.meal_fee)+'</td>'+
        '<td style="font-weight:700">'+money(b.total)+'</td>'+
        '<td><span class="b '+(b.status==='pending'?'b-warn':'b-ok')+'">'+esc(b.status_display)+'</span></td>'+
        '<td style="font-size:12px;color:var(--ink3)">'+settled+(b.note?('<br>'+esc(b.note)):'')+'</td></tr>';
    }).join('')+'</tbody></table>')
    :'<div class="empty" style="padding:20px"><p>'+TZ.noBill+'</p></div>';
  html+='</div>';
  return html;
}
</script>
{% endblock %}
