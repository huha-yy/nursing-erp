{% extends "base_light.html" %}{% block nav_weekly %}{% endblock %}

{% block content %}
<div class="wrap">
  <div class="title">
    <span class="material-symbols-outlined">photo_camera</span> 菜单 OCR 录入
    <span class="sub">拍照识别每周菜单</span>
  </div>

  <!-- Upload area -->
  <div class="c" style="text-align:center;padding:40px 20px;cursor:pointer" id="dropZone"
       onclick="document.getElementById('fileInput').click()">
    <div style="font-size:48px;margin-bottom:12px;color:var(--ink3)" id="uploadIcon"><span class="material-symbols-outlined" style="font-size:48px">add_a_photo</span></div>
    <div style="font-size:15px;font-weight:600" id="uploadHint">点击上传或粘贴菜单照片</div>
    <div style="font-size:12px;color:var(--ink3);margin-top:4px">支持 JPG/PNG，可多次添加（跨页菜单）</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files);this.value=''">
  </div>

  <!-- Preview -->
  <div id="preview" style="display:none;margin-bottom:16px">
    <div class="c">
      <div style="font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center">
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:6px">image</span>已选照片
        <span style="margin-left:auto;font-weight:400;font-size:13px;color:var(--ink3)">共 <b id="imgCount" style="color:var(--blue);font-weight:700">0</b> 张</span>
      </div>
      <div id="previewImgs" style="display:flex;flex-wrap:wrap;gap:10px"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="submit" id="startBtn" onclick="startOcr()" style="flex:1">
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px">document_scanner</span>开始识别
      </button>
      <button class="btn" onclick="clearImages()" style="padding:0 20px;font-size:15px;flex-shrink:0">清空</button>
    </div>
    <div style="text-align:center;margin-top:10px;color:var(--ink3);font-size:13px;display:none" id="progress">识别中…</div>
  </div>

  <!-- Results -->
  <div id="results" style="display:none"></div>
</div>

<script>
var _images = [];      // 待识别照片 [{dataUrl, b64}]
var _structured = null;  // 缓存识别结果

// Paste handler — 支持一次粘贴多张
document.addEventListener('paste', function(e){
  var items = (e.clipboardData||e.originalEvent.clipboardData).items;
  var files = [];
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')===0){
      var f = items[i].getAsFile();
      if(f) files.push(f);
    }
  }
  if(files.length){ e.preventDefault(); handleFiles(files); }
});

function handleFiles(files){
  if(!files || !files.length) return;
  var list = Array.prototype.slice.call(files);
  var startIdx = _images.length;
  for(var i=0;i<list.length;i++){ _images[startIdx+i] = null; }  // 占位保持顺序
  var loaded = 0;

  document.getElementById('preview').style.display = 'block';
  document.getElementById('uploadHint').textContent = '可继续添加照片，然后点「开始识别」';

  list.forEach(function(file, i){
    // 压缩大图，避免体积过大（OCR 服务上限 10MiB）
    compressImage(file, 2560, function(blob){
      var reader = new FileReader();
      reader.onload = function(ev){
        _images[startIdx+i] = {dataUrl: ev.target.result, b64: ev.target.result.split(',')[1]};
        loaded++;
        if(loaded === list.length){ renderPreviews(); }
      };
      reader.readAsDataURL(blob);
    });
  });
}

function renderPreviews(){
  var html = '';
  var count = 0;
  _images.forEach(function(im, i){
    if(!im) return;
    count++;
    html += '<div style="position:relative;width:110px;height:110px">'+
      '<img src="'+im.dataUrl+'" style="width:110px;height:110px;border-radius:8px;object-fit:cover;display:block;border:1px solid var(--line)">'+
      '<span onclick="removeImage('+i+')" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;line-height:22px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)">✕</span>'+
      '</div>';
  });
  document.getElementById('previewImgs').innerHTML = html;
  document.getElementById('imgCount').textContent = count;
}

function removeImage(i){
  _images.splice(i, 1);
  renderPreviews();
  if(!_images.filter(Boolean).length){ resetToUpload(); }
}

function clearImages(){
  _images = [];
  resetToUpload();
}

function resetToUpload(){
  document.getElementById('preview').style.display = 'none';
  document.getElementById('previewImgs').innerHTML = '';
  document.getElementById('uploadHint').textContent = '点击上传或粘贴菜单照片';
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  _structured = null;
}

function startOcr(){
  var imgs = _images.filter(Boolean);
  if(!imgs.length){ toast('请先上传菜单照片','#e05555'); return; }
  var b64s = imgs.map(function(im){ return im.b64; });
  var btn = document.getElementById('startBtn');
  btn.disabled = true;
  document.getElementById('progress').style.display = 'block';
  document.getElementById('progress').textContent = '识别中…';
  ocr(b64s);
}

// 用 Canvas 压缩图片到 maxDim 以内，输出 JPEG
function compressImage(file, maxDim, callback){
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function(){
    URL.revokeObjectURL(url);
    if(img.width <= maxDim && img.height <= maxDim){
      callback(file);  // 图不大，用原文件
      return;
    }
    var ratio = maxDim / Math.max(img.width, img.height);
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * ratio);
    canvas.height = Math.round(img.height * ratio);
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(function(blob){
      callback(blob);
    }, 'image/jpeg', 0.9);
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    callback(file);  // 加载失败，用原文件
  };
  img.src = url;
}

function ocr(images){
  fetch('/api/menu-ocr/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({images:images})})
    .then(function(r){
      if(!r.ok){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t.slice(0,200)); }); }
      return r.json();
    })
    .then(showResults)
    .catch(function(err){
      document.getElementById('progress').textContent='识别失败：'+err.message;
      document.getElementById('startBtn').disabled = false;
    });
}

function showResults(data){
  document.getElementById('startBtn').disabled = false;
  document.getElementById('progress').style.display = 'none';
  document.getElementById('uploadHint').textContent = '识别完成，请核对';
  _structured = data.structured || {};

  var days=['周一','周二','周三','周四','周五','周六','周日'];
  var meals=[['早餐','wb_sunny'],['午餐','wb_sunny'],['晚餐','bedtime']];

  // 周起始日期（默认下周一）
  var d=new Date();d.setDate(d.getDate()-d.getDay()+8);
  var ws=d.toISOString().slice(0,10);

  var html='<div class="c"><div class="c-h"><span class="material-symbols-outlined">calendar_month</span> 周菜单配置</div>'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
    '<span style="font-weight:600;font-size:14px">周起始(周一):</span>'+
    '<input type="date" class="inp" id="weekStart" value="'+ws+'" style="width:auto;padding:8px 12px">'+
    '<span style="margin-left:auto;font-size:13px;color:var(--ink3)">识别到 <b style="color:var(--blue)">'+Object.keys(_structured).length+'</b> 天</span>'+
    '</div></div>';

  var anyDay = false;
  days.forEach(function(day){
    var dayMeals = _structured[day];
    if(!dayMeals) return;  // 这天没识别到
    anyDay = true;
    html += '<div class="c"><div class="c-h"><span class="material-symbols-outlined">today</span> '+day+'</div>';
    meals.forEach(function(m){
      var mt = m[0], icon = m[1];
      var dishes = dayMeals[mt];
      if(!dishes || !dishes.length) return;
      html += '<div style="margin-bottom:14px">';
      html += '<div style="font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:8px">'+
        '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">'+icon+'</span> '+mt+'</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px" id="dishbox_'+day+'_'+mt+'">';
      dishes.forEach(function(dish){
        var checked = dish.matched ? 'checked' : '';
        var style = dish.matched
          ? 'border:2px solid var(--blue);background:var(--blue2)'
          : 'border:2px solid var(--red);background:#fff5f5';
        html += '<label style="display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;user-select:none;'+style+'" id="lbl_'+day+'_'+mt+'_'+dish.dish_id+'">'+
          '<input type="checkbox" '+checked+' data-dish-id="'+dish.dish_id+'" data-day="'+day+'" data-mt="'+mt+'" style="accent-color:var(--blue)"> '+dish.name+
          (dish.matched?'':'<span style="color:var(--red);font-size:11px">⚠未匹配</span>')+
          '</label>';
      });
      html += '</div></div>';
    });
    html += '</div>';
  });

  if(!anyDay){
    html += '<div class="c"><div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">sentiment_dissatisfied</span></div><p>未识别到菜单结构，请换张更清晰的照片</p></div></div>';
  } else if(data.unmatched && data.unmatched.length){
    html += '<div class="c" style="border:1px solid var(--red)"><div class="c-h" style="color:var(--red)">⚠ 未匹配菜品（'+data.unmatched.length+' 道）</div>'+
      '<div style="font-size:13px;color:var(--ink2)">以下菜名不在菜品库中，请先在"菜品库"中添加，或手动调整识别结果：</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+
      data.unmatched.map(function(n){return '<span style="padding:4px 10px;border:1px solid var(--red);border-radius:6px;font-size:12px;color:var(--red)">'+n+'</span>'}).join('')+
      '</div></div>';
  }

  html += '<button class="submit" onclick="batchCreate()"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px">description</span>确认创建周菜单</button>';

  document.getElementById('results').innerHTML=html;
  document.getElementById('results').style.display='block';
}

function batchCreate(){
  var ws=document.getElementById('weekStart').value;
  if(!ws){toast('请选择周起始日期','#e05555');return}
  var payload=[];
  // 遍历所有勾选的 checkbox
  document.querySelectorAll('#results input[type=checkbox]:checked').forEach(function(cb){
    var dishId = parseInt(cb.dataset.dishId);
    var day = cb.dataset.day;
    var mt = cb.dataset.mt;
    if(!dishId) return;
    // 按 day+mt 聚合
    var found = payload.find(function(p){return p.day===day && p.meal_type===mt});
    if(found){ found.dish_ids.push(dishId); }
    else{ payload.push({week_start:ws, day:day, meal_type:mt, dish_ids:[dishId]}); }
  });

  if(!payload.length){toast('请至少勾选一道菜','#e05555');return}

  var btn = event.target;
  btn.disabled = true;
  fetch('/api/menu-ocr/batch-create/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(d){
      toast('<span class="material-symbols-outlined">check_circle</span> 已创建 '+d.count+' 条周菜单','#3ca07a');
      btn.disabled = false;
    }).catch(function(){toast('创建失败','#e05555');btn.disabled=false});
}
</script>
{% endblock %}
