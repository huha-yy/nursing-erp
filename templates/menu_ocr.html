{% extends "base_light.html" %}{% block nav_weekly %}{% endblock %}

{% block content %}
<div class="wrap">
  <div class="title">
    <span class="material-symbols-outlined">photo_camera</span> 菜单 OCR 录入
    <span class="sub">拍照自动识别每周菜单</span>
  </div>

  <!-- Upload area -->
  <div class="c" style="text-align:center;padding:40px 20px;cursor:pointer" id="dropZone"
       onclick="document.getElementById('fileInput').click()">
    <div style="font-size:48px;margin-bottom:12px;color:var(--ink3)" id="uploadIcon"><span class="material-symbols-outlined" style="font-size:48px">add_a_photo</span></div>
    <div style="font-size:15px;font-weight:600" id="uploadHint">点击上传或粘贴菜单照片</div>
    <div style="font-size:12px;color:var(--ink3);margin-top:4px">支持 JPG/PNG，手写或印刷菜单均可</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
  </div>

  <!-- Preview -->
  <div id="preview" style="display:none;margin-bottom:16px">
    <img id="previewImg" src="" style="max-width:100%;max-height:300px;border-radius:8px;display:block;margin:0 auto">
    <div style="text-align:center;margin-top:8px;color:var(--ink3);font-size:13px" id="progress">识别中…</div>
  </div>

  <!-- Results -->
  <div id="results" style="display:none"></div>
</div>

<script>
var _structured = null;  // 缓存识别结果

// Paste handler
document.addEventListener('paste', function(e){
  var items = (e.clipboardData||e.originalEvent.clipboardData).items;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')===0){
      e.preventDefault();handleFile(items[i].getAsFile());return;
    }
  }
});

function handleFile(file){
  if(!file)return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var b64 = ev.target.result.split(',')[1];
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('progress').textContent = '识别中…';
    document.getElementById('uploadHint').textContent = '正在识别…';
    ocr(b64);
  };
  reader.readAsDataURL(file);
}

function ocr(b64){
  fetch('/api/menu-ocr/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:b64})})
    .then(function(r){return r.json()}).then(showResults)
    .catch(function(){document.getElementById('progress').textContent='识别失败，请重试'});
}

function showResults(data){
  document.getElementById('uploadHint').textContent = '识别完成，请核对';
  document.getElementById('progress').textContent = '';
  _structured = data.structured || {};

  var days=['周一','周二','周三','周四','周五','周六','周日'];
  var meals=[['早餐','wb_sunny'],['午餐','wb_sunny'],['晚餐','bedtime']];

  // 周起始日期（默认下周一）
  var d=new Date();d.setDate(d.getDate()-d.getDay()+8);
  var ws=d.toISOString().slice(0,10);

  var html='<div class="c"><div class="c-h"><span class="material-symbols-outlined">calendar_month</span> 周菜单配置</div>'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
    '<span style="font-weight:600;font-size:14px">周起始(周一):</span>'+
    '<input type="date" class="inp" id="weekStart" value="'+ws+'" style="width:auto;padding:8px 12px">'+
    '<span style="margin-left:auto;font-size:13px;color:var(--ink3)">识别到 <b style="color:var(--blue)">'+Object.keys(_structured).length+'</b> 天</span>'+
    '</div></div>';

  var anyDay = false;
  days.forEach(function(day){
    var dayMeals = _structured[day];
    if(!dayMeals) return;  // 这天没识别到
    anyDay = true;
    html += '<div class="c"><div class="c-h"><span class="material-symbols-outlined">today</span> '+day+'</div>';
    meals.forEach(function(m){
      var mt = m[0], icon = m[1];
      var dishes = dayMeals[mt];
      if(!dishes || !dishes.length) return;
      html += '<div style="margin-bottom:14px">';
      html += '<div style="font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:8px">'+
        '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">'+icon+'</span> '+mt+'</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px" id="dishbox_'+day+'_'+mt+'">';
      dishes.forEach(function(dish){
        var checked = dish.matched ? 'checked' : '';
        var style = dish.matched
          ? 'border:2px solid var(--blue);background:var(--blue2)'
          : 'border:2px solid var(--red);background:#fff5f5';
        html += '<label style="display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;user-select:none;'+style+'" id="lbl_'+day+'_'+mt+'_'+dish.dish_id+'">'+
          '<input type="checkbox" '+checked+' data-dish-id="'+dish.dish_id+'" data-day="'+day+'" data-mt="'+mt+'" style="accent-color:var(--blue)"> '+dish.name+
          (dish.matched?'':'<span style="color:var(--red);font-size:11px">⚠未匹配</span>')+
          '</label>';
      });
      html += '</div></div>';
    });
    html += '</div>';
  });

  if(!anyDay){
    html += '<div class="c"><div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">sentiment_dissatisfied</span></div><p>未识别到菜单结构，请换张更清晰的照片</p></div></div>';
  } else if(data.unmatched && data.unmatched.length){
    html += '<div class="c" style="border:1px solid var(--red)"><div class="c-h" style="color:var(--red)">⚠ 未匹配菜品（'+data.unmatched.length+' 道）</div>'+
      '<div style="font-size:13px;color:var(--ink2)">以下菜名不在菜品库中，请先在"菜品库"中添加，或手动调整识别结果：</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+
      data.unmatched.map(function(n){return '<span style="padding:4px 10px;border:1px solid var(--red);border-radius:6px;font-size:12px;color:var(--red)">'+n+'</span>'}).join('')+
      '</div></div>';
  }

  html += '<button class="submit" onclick="batchCreate()"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px">description</span>确认创建周菜单</button>';

  document.getElementById('results').innerHTML=html;
  document.getElementById('results').style.display='block';
}

function batchCreate(){
  var ws=document.getElementById('weekStart').value;
  if(!ws){toast('请选择周起始日期','#e05555');return}
  var payload=[];
  // 遍历所有勾选的 checkbox
  document.querySelectorAll('#results input[type=checkbox]:checked').forEach(function(cb){
    var dishId = parseInt(cb.dataset.dishId);
    var day = cb.dataset.day;
    var mt = cb.dataset.mt;
    if(!dishId) return;
    // 按 day+mt 聚合
    var found = payload.find(function(p){return p.day===day && p.meal_type===mt});
    if(found){ found.dish_ids.push(dishId); }
    else{ payload.push({week_start:ws, day:day, meal_type:mt, dish_ids:[dishId]}); }
  });

  if(!payload.length){toast('请至少勾选一道菜','#e05555');return}

  var btn = event.target;
  btn.disabled = true;
  fetch('/api/menu-ocr/batch-create/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(d){
      toast('<span class="material-symbols-outlined">check_circle</span> 已创建 '+d.count+' 条周菜单','#3ca07a');
      btn.disabled = false;
    }).catch(function(){toast('创建失败','#e05555');btn.disabled=false});
}
</script>
{% endblock %}
