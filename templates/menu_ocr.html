{% extends "base_light.html" %}{% block nav_weekly %}{% endblock %}

{% block content %}
<div class="wrap">
  <div class="title"><span class="material-symbols-outlined">photo_camera</span> 菜单 OCR 录入<span class="sub">拍照自动识别菜品</span></div>

  <!-- Upload area -->
  <div class="c" style="text-align:center;padding:40px 20px;cursor:pointer" id="dropZone"
       onclick="document.getElementById('fileInput').click()">
    <div style="font-size:48px;margin-bottom:12px" id="uploadIcon"><span class="material-symbols-outlined">add_a_photo</span></div>
    <div style="font-size:15px;font-weight:600" id="uploadHint">点击上传或粘贴菜单照片</div>
    <div style="font-size:12px;color:var(--ink3);margin-top:4px">支持 JPG/PNG，越清晰识别越准</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
  </div>

  <!-- Preview -->
  <div id="preview" style="display:none;margin-bottom:16px">
    <img id="previewImg" src="" style="max-width:100%;max-height:300px;border-radius:8px;display:block;margin:0 auto">
    <div style="text-align:center;margin-top:8px;color:var(--ink3);font-size:13px" id="progress">识别中…</div>
  </div>

  <!-- Results -->
  <div id="results" style="display:none"></div>
</div>

<script>
// Paste handler
document.addEventListener('paste', function(e){
  var items = (e.clipboardData||e.originalEvent.clipboardData).items;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')===0){
      e.preventDefault();handleFile(items[i].getAsFile());return;
    }
  }
});

function handleFile(file){
  if(!file)return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var b64 = ev.target.result.split(',')[1];
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('progress').textContent = '识别中…';
    document.getElementById('uploadIcon').textContent = '⏳';
    document.getElementById('uploadHint').textContent = '正在识别…';
    ocr(b64);
  };
  reader.readAsDataURL(file);
}

function ocr(b64){
  fetch('/api/menu-ocr/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:b64})})
    .then(function(r){return r.json()}).then(showResults)
    .catch(function(){document.getElementById('progress').textContent='识别失败，请重试'});
}

function showResults(data){
  document.getElementById('uploadIcon').textContent = '<span class="material-symbols-outlined">check_circle</span>';
  document.getElementById('uploadHint').textContent = '识别完成！';
  document.getElementById('progress').textContent = '';
  if(!data.matches||!data.matches.length){
    document.getElementById('results').innerHTML='<div class="c"><div class="empty"><div class="ic"><span class="material-symbols-outlined">sentiment_dissatisfied</span></div><p>未识别到内容，请换张更清晰的照片</p></div></div>';
    return;
  }

  var days=['周一','周二','周三','周四','周五','周六','周日'];
  var mts=['早餐','午餐','晚餐'];
  // Auto-detect next Monday
  var d=new Date();d.setDate(d.getDate()-d.getDay()+8);
  var ws=d.toISOString().slice(0,10);

  var html='<div class="c"><div class="c-h"><span class="material-symbols-outlined">calendar_month</span> 周菜单配置</div>'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'+
    '<span style="font-weight:600;font-size:14px">周起始:</span>'+
    '<input type="date" class="inp" id="weekStart" value="'+ws+'" style="width:auto;padding:8px 12px">'+
    '</div></div>';

  var currentDay='', currentMt='';
  data.matches.forEach(function(m,i){
    if(!m.line)return;
    html+='<div class="c" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
      '<span style="font-weight:600;min-width:30px;color:var(--ink3)">#'+(i+1)+'</span>'+
      '<span style="flex:1;min-width:120px;font-size:14px">'+m.line+'</span>'+
      '<select class="inp" style="width:80px;padding:6px 8px;font-size:13px" id="day_'+i+'">'+
      days.map(function(d){return'<option>'+d+'</option>'}).join('')+'</select>'+
      '<select class="inp" style="width:80px;padding:6px 8px;font-size:13px" id="mt_'+i+'">'+
      mts.map(function(mt){return'<option>'+mt+'</option>'}).join('')+'</select>';
    if(m.suggestions&&m.suggestions.length){
      html+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;width:100%">';
      m.suggestions.forEach(function(s){
        html+='<label style="display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px;transition:all .12s;user-select:none" onclick="this.style.borderColor=this.style.borderColor==\'var(--blue)\'?\'var(--line)\':\'var(--blue)\';this.style.background=this.style.background==\'var(--blue2)\'?\'transparent\':\'var(--blue2)\'">'+
          '<input type="checkbox" value="'+s.id+'" data-dish="'+s.name+'" style="accent-color:var(--blue)">'+s.name+'<span style="color:var(--ink3);font-size:11px">('+Math.round(s.score*100)+'%)</span></label>';
      });
      html+='</div>';
    }
    html+='</div></div>';
  });

  html+='<button class="submit" onclick="batchCreate()"><span class="material-symbols-outlined">description</span> 确认创建周菜单</button>';
  document.getElementById('results').innerHTML=html;
  document.getElementById('results').style.display='block';
}

window._selectedDishes = {};

function batchCreate(){
  var ws=document.getElementById('weekStart').value;
  var payload=[];
  var rows=document.getElementById('results').querySelectorAll('.c');
  // Skip the first card (week config)
  rows.forEach(function(row,i){
    if(i===0)return; // skip config card
    var idx=i-1;
    var day=document.getElementById('day_'+idx).value;
    var mt=document.getElementById('mt_'+idx).value;
    var cbs=row.querySelectorAll('input[type=checkbox]:checked');
    var ids=[];
    cbs.forEach(function(cb){ids.push(parseInt(cb.value))});
    if(ids.length>0) payload.push({week_start:ws,day:day,meal_type:mt,dish_ids:ids});
  });
  if(!payload.length){toast('请至少为一个菜选择日期和餐次','var(--red)');return}
  fetch('/api/menu-ocr/batch-create/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(d){
      toast('<span class="material-symbols-outlined">check_circle</span> 已创建 '+d.count+' 条周菜单','var(--green)');
    }).catch(function(){toast('创建失败','var(--red)')});
}
</script>
{% endblock %}
