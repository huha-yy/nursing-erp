{% extends "family_base.html" %}{% block nav_pw %}on{% endblock %}

{% block content %}
<div class="wrap" style="max-width:460px">
  <div class="title"><span class="material-symbols-outlined">lock</span> 修改密码</div>

  {% if request.GET.changed %}
  <div style="background:#ecfdf5;color:#065f46;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:14px">
    密码已修改，后续请使用新密码登录
  </div>
  {% endif %}
  {% if error %}
  <div style="background:#fef2f2;color:#991b1b;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:14px">{{ error }}</div>
  {% endif %}

  <div class="c">
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:12px">
        <input class="inp" type="password" name="old_password" placeholder="当前密码" required autocomplete="current-password">
      </div>
      <div style="margin-bottom:12px">
        <input class="inp" type="password" name="new_password1" placeholder="新密码（至少 6 位）" required autocomplete="new-password">
      </div>
      <div style="margin-bottom:20px">
        <input class="inp" type="password" name="new_password2" placeholder="再次输入新密码" required autocomplete="new-password">
      </div>
      <button type="submit" class="submit">保存新密码</button>
    </form>
  </div>
</div>
{% endblock %}
