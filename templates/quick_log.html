{% extends "base_light.html" %}{% block nav_quick %}on{% endblock %}{% load i18n %}

{% block content %}
<div class="wrap">
  <div class="title">
    <span class="material-symbols-outlined">edit_note</span> {% translate "快速记录" %}
    <span class="sub" id="hint">{% translate "选择老人后开始记录" %}</span>
  </div>

  <input class="inp" type="text" id="q" placeholder="{% translate "搜索老人姓名…" %}" autocomplete="off" autofocus>
  <div id="list" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
    <div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">search</span></div><p>{% translate "输入姓名搜索老人" %}</p></div>
  </div>

  <div id="act" style="display:none;margin-top:24px">
    <div class="c"><div class="c-h">{% translate "选择护理类型" %}</div>
      <div id="cats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    </div>
    <div class="c">
      <textarea class="inp" id="det" placeholder="{% translate "备注（选填）：血压值、进食量、异常情况…" %}" style="min-height:56px;resize:vertical"></textarea>
    </div>
    <button class="submit" id="go" disabled onclick="submitLog()">{% translate "提交记录" %}</button>
  </div>
</div>

<script>
var TZ = {
  searchPrompt: '{% translate "输入姓名搜索老人" %}',
  searching: '{% translate "搜索中…" %}',
  noMatch: '{% translate "未找到匹配的老人" %}',
  roomSuffix: '{% translate "室" %}',
  noHistory: '{% translate "无特殊病史" %}',
  selected: '{% translate "已选：{} · {}" %}',
  submitting: '{% translate "提交中…" %}',
  recorded: '{% translate "已记录 — {}" %}',
  submitFail: '{% translate "提交失败" %}',
  networkError: '{% translate "网络错误" %}',
  submitLog: '{% translate "提交记录" %}',
  hintStart: '{% translate "选择老人后开始记录" %}'
};
function trfmt(tpl) {
  var vals = Array.prototype.slice.call(arguments, 1), i = 0;
  return tpl.replace(/\{\}/g, function () { return vals[i++]; });
}
var sr=null,sc=null;
[{k:'feeding',l:'{% translate "喂饭" %}',i:'restaurant'},{k:'hygiene',l:'{% translate "洗漱" %}',i:'shower'},{k:'toilet',l:'{% translate "如厕" %}',i:'wc'},
 {k:'turning',l:'{% translate "翻身" %}',i:'autorenew'},{k:'medicine',l:'{% translate "服药" %}',i:'medication'},
 {k:'vital_signs',l:'{% translate "体征" %}',i:'monitor_heart'},{k:'rehab',l:'{% translate "康复" %}',i:'directions_run'},
 {k:'other',l:'{% translate "其他" %}',i:'more_horiz'}].forEach(function(c){
  var b=document.createElement('button');b.className='btn';
  b.innerHTML='<span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px">'+c.i+'</span>'+c.l;
  b.onclick=function(){document.querySelectorAll('#cats .btn').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');sc=c.k;document.getElementById('go').disabled=false;};
  document.getElementById('cats').appendChild(b);
});
var t;document.getElementById('q').addEventListener('input',function(){
  clearTimeout(t);var q=this.value.trim();if(!q){document.getElementById('list').innerHTML='<div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">search</span></div><p>'+TZ.searchPrompt+'</p></div>';return}
  document.getElementById('list').innerHTML='<div class="empty"><p>'+TZ.searching+'</p></div>';t=setTimeout(function(){search(q)},250);
});
function search(q){
  fetch('/api/residents/?search='+encodeURIComponent(q)+'&limit=20').then(function(r){return r.json()}).then(function(d){
    var items=d.items||d,l=document.getElementById('list');if(!items.length){l.innerHTML='<div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">sentiment_dissatisfied</span></div><p>'+TZ.noMatch+'</p></div>';return}
    l.innerHTML=items.map(function(r){return'<div class="rc" data-id="'+r.id+'" onclick="sel('+r.id+',\''+r.name+'\',\''+r.room+'\')">'+
      '<div class="av">'+r.name.charAt(0)+'</div><div class="inf"><div class="n">'+r.name+' · '+r.room+TZ.roomSuffix+'</div>'+
      '<div class="m">'+r.care_level+' | '+(r.diagnosis||TZ.noHistory)+' | '+r.building+r.floor+'</div></div><div class="ck"></div></div>'}).join('');
  });
}
function sel(id,name,room){sr={id:id,name:name,room:room};
  document.querySelectorAll('.rc').forEach(function(c){c.classList.remove('sel')});document.querySelector('[data-id="'+id+'"]').classList.add('sel');
  document.getElementById('hint').textContent=trfmt(TZ.selected,name,room+' '+TZ.roomSuffix);document.getElementById('act').style.display='block';
  document.getElementById('act').scrollIntoView({behavior:'smooth',block:'center'});
}
function submitLog(){if(!sr||!sc)return;var b=document.getElementById('go');b.disabled=true;b.textContent=TZ.submitting;
  fetch('/api/nursing-logs/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resident_id:sr.id,category:sc,detail:document.getElementById('det').value,staff_name:''})})
  .then(function(r){return r.json()}).then(function(d){if(d.status==='created'){toast(trfmt(TZ.recorded,sr.name),'var(--green)');rst()}else{toast(TZ.submitFail,'var(--red)')}})
  .catch(function(){toast(TZ.networkError,'var(--red)')}).finally(function(){b.disabled=false;b.textContent=TZ.submitLog});
}
function rst(){sr=null;sc=null;document.getElementById('q').value='';document.getElementById('det').value='';document.getElementById('hint').textContent=TZ.hintStart;document.getElementById('list').innerHTML='<div class="empty"><div class="ic"><span class="material-symbols-outlined" style="font-size:40px">search</span></div><p>'+TZ.searchPrompt+'</p></div>';document.getElementById('act').style.display='none';document.querySelectorAll('#cats .btn').forEach(function(b){b.classList.remove('sel')});}
</script>
{% endblock %}
