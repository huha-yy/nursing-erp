{% extends "base_light.html" %}
{% block nav_quick %}active{% endblock %}

{% block content %}
<div class="container">
  <div class="page-title" style="display:flex;align-items:center;gap:10px;">
    <span>📝</span> 护理快速记录
  </div>

  <!-- 搜索 -->
  <div class="card" style="margin-bottom:16px;">
    <input type="text" id="searchInput" placeholder="🔍 输入老人姓名搜索..."
      style="width:100%;padding:12px 14px;font-size:15px;border:2px solid var(--gray-200);border-radius:8px;
             font-family:inherit;background:var(--gray-50);"
      autocomplete="off" autofocus onfocus="this.style.borderColor='var(--primary)';this.style.background='#fff'"
      onblur="this.style.borderColor='var(--gray-200)';this.style.background='var(--gray-50)'">
  </div>

  <!-- 搜索结果 -->
  <div id="residentList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
    <div class="empty-state"><div class="icon">🔍</div>输入姓名搜索老人</div>
  </div>

  <!-- 操作区 -->
  <div id="actionArea" style="display:none">
    <div class="card">
      <div class="card-header">选择护理类型</div>
      <div id="categoryGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;"></div>
    </div>
    <div class="card">
      <textarea id="detailInput" placeholder="备注（选填）：如血压值、进食量、异常情况..."
        style="width:100%;padding:12px;font-size:14px;border:2px solid var(--gray-200);border-radius:8px;
               font-family:inherit;min-height:60px;resize:vertical;"
        onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--gray-200)'"></textarea>
    </div>
    <button id="submitBtn" disabled onclick="submitLog()"
      style="width:100%;padding:15px;font-size:16px;font-weight:700;color:#fff;background:var(--primary);
             border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;transition:background .15s;"
      onmouseover="if(!this.disabled)this.style.background='var(--primary-hover)'"
      onmouseout="this.style.background='var(--primary)'"
    >提交记录</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;
  border-radius:8px;color:#fff;font-weight:600;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;
  pointer-events:none;"></div>

<script>
var selectedResident=null, selectedCategory=null;
var CATS=[{k:'feeding',l:'🍚 喂饭'},{k:'hygiene',l:'🛁 洗漱'},{k:'toilet',l:'🚽 如厕'},
  {k:'turning',l:'🔄 翻身'},{k:'medicine',l:'💊 服药'},{k:'vital_signs',l:'🩺 测体征'},
  {k:'rehab',l:'🏃 康复'},{k:'other',l:'📋 其他'}];

// Init category buttons
var g=document.getElementById('categoryGrid');
CATS.forEach(function(c){
  var b=document.createElement('button');
  b.textContent=c.l;
  b.style.cssText='padding:14px 4px;font-size:14px;font-weight:600;border:2px solid var(--gray-200);'+
    'border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;transition:all .15s';
  b.onclick=function(){
    document.querySelectorAll('#categoryGrid button').forEach(function(x){x.style.borderColor='var(--gray-200)';x.style.background='#fff';x.style.color='var(--gray-800)';});
    b.style.borderColor='var(--primary)';b.style.background='var(--primary-light)';b.style.color='var(--primary)';
    selectedCategory=c.k;document.getElementById('submitBtn').disabled=false;
  };
  g.appendChild(b);
});

var timer;
document.getElementById('searchInput').addEventListener('input',function(){
  clearTimeout(timer); var q=this.value.trim();
  if(!q){document.getElementById('residentList').innerHTML='<div class="empty-state"><div class="icon">🔍</div>输入姓名搜索老人</div>';return;}
  document.getElementById('residentList').innerHTML='<div class="empty-state">搜索中…</div>';
  timer=setTimeout(function(){search(q)},300);
});

function search(q){
  fetch('/api/residents/?search='+encodeURIComponent(q)+'&limit=20')
    .then(function(r){return r.json();}).then(function(d){
      var items=d.items||d,list=document.getElementById('residentList');
      if(!items.length){list.innerHTML='<div class="empty-state"><div class="icon">😕</div>未找到匹配的老人</div>';return;}
      list.innerHTML=items.map(function(r){return '<div class="card" data-id="'+r.id+
        '" onclick="select('+r.id+',\''+r.name+'\',\''+r.room+'\',\''+r.care_level+'\',\''+(r.diagnosis||'')+'\')" style="cursor:pointer;padding:14px 16px;transition:all .15s;border:2px solid var(--gray-200);" onmouseover="this.style.borderColor=\'#93c5fd\'" onmouseout="!this.classList.contains(\'sel\')&&(this.style.borderColor=\'var(--gray-200)\')">'+
        '<div style="font-size:15px;font-weight:700;">'+r.name+' · '+r.room+'室</div>'+
        '<div style="font-size:13px;color:var(--gray-500);margin-top:3px;">'+r.care_level+' | '+(r.diagnosis||'无特殊病史')+' | '+r.building+r.floor+'</div></div>';}).join('');
    });
}

function select(id,name,room,cl,diag){
  selectedResident={id:id,name:name,room:room,careLevel:cl,diagnosis:diag};
  document.querySelectorAll('#residentList .card').forEach(function(c){c.classList.remove('sel');c.style.borderColor='var(--gray-200)';});
  var el=document.querySelector('[data-id="'+id+'"]');
  el.classList.add('sel');el.style.borderColor='var(--primary)';el.style.background='var(--primary-light)';
  document.getElementById('actionArea').style.display='block';
  document.getElementById('actionArea').scrollIntoView({behavior:'smooth'});
}

function submitLog(){
  if(!selectedResident||!selectedCategory)return; var b=document.getElementById('submitBtn');
  b.disabled=true;b.textContent='提交中…';b.style.opacity='0.6';
  fetch('/api/nursing-logs/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({resident_id:selectedResident.id,category:selectedCategory,
      detail:document.getElementById('detailInput').value,staff_name:''})})
    .then(function(r){return r.json();}).then(function(d){
      if(d.status==='created'){toast('✅ 记录成功','#10b981');reset();}
      else{toast('提交失败','#ef4444');}
    }).catch(function(){toast('网络错误','#ef4444')})
    .finally(function(){b.disabled=false;b.textContent='提交记录';b.style.opacity='1';});
}

function reset(){
  selectedResident=null;selectedCategory=null;
  document.getElementById('searchInput').value='';
  document.getElementById('detailInput').value='';
  document.getElementById('residentList').innerHTML='<div class="empty-state"><div class="icon">🔍</div>输入姓名搜索老人</div>';
  document.getElementById('actionArea').style.display='none';
  document.querySelectorAll('#categoryGrid button').forEach(function(b){b.style.borderColor='var(--gray-200)';b.style.background='#fff';b.style.color='var(--gray-800)';});
}

function toast(m,c){var t=document.getElementById('toast');t.textContent=m;t.style.background=c;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2000);}
</script>
{% endblock %}
