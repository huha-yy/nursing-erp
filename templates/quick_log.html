<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="快速记录">
<title>快速记录 — 护理员</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; min-height: 100vh; }
  .header { background: #3b82f6; color: #fff; padding: 14px 16px; text-align: center; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; }
  .container { max-width: 480px; margin: 0 auto; padding: 12px; }
  .search-box { width: 100%; padding: 12px 16px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 12px; background: #fff; }
  .search-box:focus { outline: none; border-color: #3b82f6; }
  .resident-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; max-height: 240px; overflow-y: auto; }
  .resident-card { background: #fff; border-radius: 8px; padding: 12px; border: 2px solid transparent; cursor: pointer; transition: border-color .15s; }
  .resident-card:hover { border-color: #93c5fd; }
  .resident-card.selected { border-color: #3b82f6; background: #eff6ff; }
  .resident-card .name { font-size: 16px; font-weight: 700; }
  .resident-card .info { font-size: 13px; color: #888; margin-top: 2px; }
  .section-title { font-size: 14px; color: #888; font-weight: 600; margin-bottom: 8px; }
  .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .cat-btn { padding: 14px 4px; font-size: 14px; font-weight: 600; border: 2px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; text-align: center; transition: all .15s; }
  .cat-btn:active { transform: scale(0.96); }
  .cat-btn.selected { border-color: #3b82f6; background: #eff6ff; color: #3b82f6; }
  .detail-input { width: 100%; padding: 12px; font-size: 15px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 16px; resize: vertical; min-height: 64px; }
  .detail-input:focus { outline: none; border-color: #3b82f6; }
  .submit-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; color: #fff; background: #3b82f6; border: none; border-radius: 8px; cursor: pointer; transition: background .15s; }
  .submit-btn:active { background: #2563eb; }
  .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 15px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { background: #10b981; }
  .toast.error { background: #ef4444; }
  .loading { text-align: center; color: #94a3b8; padding: 30px; font-size: 14px; }
  .empty { text-align: center; color: #bbb; padding: 20px; font-size: 14px; }
</style>
</head>
<body>

<div class="header"><h1>📝 快速记录</h1></div>

<div class="container">
  <!-- 搜索老人 -->
  <input class="search-box" type="text" id="searchInput"
         placeholder="🔍 搜索老人姓名..."
         autocomplete="off" autofocus>

  <!-- 老人列表 -->
  <div class="resident-list" id="residentList">
    <div class="loading">输入姓名搜索老人...</div>
  </div>

  <!-- 选中老人后显示操作区 -->
  <div id="actionArea" style="display:none">
    <div class="section-title">选择护理类型</div>
    <div class="category-grid" id="categoryGrid"></div>

    <textarea class="detail-input" id="detailInput"
              placeholder="备注（选填）：如血压值、进食量、异常情况..."></textarea>

    <button class="submit-btn" id="submitBtn" disabled>提交记录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  {key:'feeding',    label:'喂饭',    icon:'🍚'},
  {key:'hygiene',    label:'洗漱',    icon:'🛁'},
  {key:'toilet',     label:'如厕',    icon:'🚽'},
  {key:'turning',    label:'翻身',    icon:'🔄'},
  {key:'medicine',   label:'服药',    icon:'💊'},
  {key:'vital_signs',label:'测体征',  icon:'🩺'},
  {key:'rehab',      label:'康复',    icon:'🏃'},
  {key:'other',      label:'其他',    icon:'📋'},
];

let selectedResident = null;
let selectedCategory = null;

// Render category buttons
const catGrid = document.getElementById('categoryGrid');
CATEGORIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = c.icon + ' ' + c.label;
  btn.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCategory = c.key;
    document.getElementById('submitBtn').disabled = !selectedResident;
  };
  catGrid.appendChild(btn);
});

// Search residents
let searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (!q) {
    document.getElementById('residentList').innerHTML = '<div class="loading">输入姓名搜索老人...</div>';
    return;
  }
  document.getElementById('residentList').innerHTML = '<div class="loading">搜索中...</div>';
  searchTimer = setTimeout(() => searchResidents(q), 300);
});

function searchResidents(q) {
  fetch(`/api/residents/?search=${encodeURIComponent(q)}&limit=20`)
    .then(r => r.json())
    .then(data => {
      const items = data.items || data;
      const list = document.getElementById('residentList');
      if (!items.length) {
        list.innerHTML = '<div class="empty">未找到匹配的老人</div>';
        return;
      }
      list.innerHTML = items.map(r => `
        <div class="resident-card" data-id="${r.id}"
             onclick="selectResident(${r.id}, '${r.name}', '${r.room}', '${r.care_level}', '${r.diagnosis||''}')">
          <div class="name">${r.name} · ${r.room}室</div>
          <div class="info">${r.care_level} | ${r.diagnosis||'无特殊病史'} | ${r.building} ${r.floor}</div>
        </div>
      `).join('');
    })
    .catch(() => {
      document.getElementById('residentList').innerHTML = '<div class="empty">搜索失败，请重试</div>';
    });
}

function selectResident(id, name, room, careLevel, diagnosis) {
  selectedResident = { id, name, room, careLevel, diagnosis };
  document.querySelectorAll('.resident-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`[data-id="${id}"]`).classList.add('selected');
  document.getElementById('actionArea').style.display = 'block';
  document.getElementById('submitBtn').disabled = !selectedCategory;
  document.getElementById('actionArea').scrollIntoView({behavior:'smooth'});
}

// Submit
document.getElementById('submitBtn').addEventListener('click', function() {
  if (!selectedResident || !selectedCategory) return;

  const btn = this;
  btn.disabled = true;
  btn.textContent = '提交中...';

  fetch('/api/nursing-logs/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      resident_id: selectedResident.id,
      category: selectedCategory,
      detail: document.getElementById('detailInput').value,
      staff_name: '',
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'created') {
      showToast('✅ 记录成功！', 'success');
      resetForm();
    } else {
      showToast('提交失败，请重试', 'error');
    }
  })
  .catch(() => showToast('网络错误，请重试', 'error'))
  .finally(() => {
    btn.disabled = false;
    btn.textContent = '提交记录';
  });
});

function resetForm() {
  selectedResident = null;
  selectedCategory = null;
  document.getElementById('searchInput').value = '';
  document.getElementById('detailInput').value = '';
  document.getElementById('residentList').innerHTML = '<div class="loading">输入姓名搜索老人...</div>';
  document.getElementById('actionArea').style.display = 'none';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('submitBtn').disabled = true;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
