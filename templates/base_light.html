{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ page_title }}">
<title>{{ page_title }} — 养老院管理系统</title>
<link href="{% static 'unfold/fonts/inter/styles.css' %}" rel="stylesheet">
<style>
  :root {
    --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #eff6ff;
    --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
    --gray-400: #9ca3af; --gray-500: #6b7280; --gray-600: #4b5563;
    --gray-700: #374151; --gray-800: #1f2937; --gray-900: #111827;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--gray-50); color: var(--gray-800); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--gray-200); padding: 0 20px;
    display: flex; align-items: center; height: 52px; gap: 16px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .logo { font-size: 15px; font-weight: 700; color: var(--gray-900); letter-spacing: -.01em; }
  .topbar .logo a { color: inherit; text-decoration: none; }
  .topbar .nav-links { display: flex; gap: 4px; margin-left: auto; }
  .topbar .nav-link {
    padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
    color: var(--gray-600); text-decoration: none; transition: all .15s;
  }
  .topbar .nav-link:hover { background: var(--gray-100); color: var(--gray-900); }
  .topbar .nav-link.active { background: var(--primary-light); color: var(--primary); }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 20px; }
  .page-title { font-size: 20px; font-weight: 700; color: var(--gray-900); margin-bottom: 20px; }
  .card {
    background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card-header { font-size: 15px; font-weight: 600; color: var(--gray-800); margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; gap: 8px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-box {
    background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius);
    padding: 16px; text-align: center; box-shadow: var(--shadow);
  }
  .stat-box .num { font-size: 28px; font-weight: 800; color: var(--primary); letter-spacing: -.02em; }
  .stat-box .label { font-size: 12px; color: var(--gray-500); margin-top: 4px; font-weight: 500; }
  .stat-box.warn .num { color: #ef4444; }
  .stat-box.accent .num { color: #8b5cf6; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--gray-200); color: var(--gray-500);
    font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--gray-100); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; }
  .badge-success { background: #d1fae5; color: #065f46; }
  .badge-warn { background: #fef3c7; color: #92400e; }
  .badge-danger { background: #fee2e2; color: #991b1b; }
  .badge-neutral { background: var(--gray-100); color: var(--gray-600); }
  .empty-state { text-align: center; padding: 40px; color: var(--gray-400); font-size: 14px; }
  .empty-state .icon { font-size: 40px; margin-bottom: 8px; }
  @media (max-width: 600px) {
    .container { padding: 16px 12px; }
    .topbar { padding: 0 12px; }
    .topbar .nav-link { font-size: 12px; padding: 4px 8px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><a href="/admin/">养老院管理系统</a></div>
  <div class="nav-links">
    <a href="/quick-log/" class="nav-link {% block nav_quick %}{% endblock %}">快速记录</a>
    <a href="/kitchen/" class="nav-link {% block nav_kitchen %}{% endblock %}">食堂看板</a>
    <a href="/finance/" class="nav-link {% block nav_finance %}{% endblock %}">财务月结</a>
    <a href="/admin/" class="nav-link">管理后台</a>
  </div>
</div>
{% block content %}{% endblock %}
</body>
</html>
