[project]
name = "nursing-erp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "django-unfold>=0.40",
    "django-ninja>=1.3",
    "psycopg2-binary>=2.9",
    "django-import-export>=4.0",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "whitenoise>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nursing_erp.settings"
addopts = "-v"
asyncio_mode = "auto"
